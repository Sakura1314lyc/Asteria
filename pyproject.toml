[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agent"
version = "0.11.0"
description = "A full-stack computer-science research workbench with human screening, reproducibility analysis, and auditable evidence workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paper Research Agent contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Sakura1314lyc/Asteria"
Repository = "https://github.com/Sakura1314lyc/Asteria.git"
Issues = "https://github.com/Sakura1314lyc/Asteria/issues"
Documentation = "https://github.com/Sakura1314lyc/Asteria/tree/main/docs"

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7,<3",
]
pdf = ["pypdf>=5,<7"]
all = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_agent = ["data/*.json", "web_dist/*", "web_dist/assets/*"]
